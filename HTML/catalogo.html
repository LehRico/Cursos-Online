<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de cursos — LeKa Dance Studio</title>
  <meta name="description" content="Catálogo de cursos de dança online: ballet, hip hop, contemporânea, danças urbanas, dança de salão, jazz, sapateado e dança do ventre." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
  <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/animacoes.css" />
  <link rel="stylesheet" href="css/paginas/catalogo.css" />
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
  <header class="cabecalho" id="cabecalho"></header>

  <main id="conteudo-principal">
    <section class="secao">
      <div class="envolucro">
        <div class="cabecalho-secao">
          <h1>Catálogo de cursos</h1>
          <div class="filtros">
            <div class="filtros__chips" id="filtros-chips"></div>
            <select class="campo-select-inline" id="filtro-nivel" aria-label="Filtrar por nível">
              <option value="todos">Todos os níveis</option>
              <option value="iniciante">Iniciante</option>
              <option value="intermediário">Intermediário</option>
              <option value="avançado">Avançado</option>
            </select>
            <div class="filtros__busca campo-busca">
              <i class="ph ph-bold ph-magnifying-glass" aria-hidden="true"></i>
              <input class="campo-busca__input" type="search" id="filtro-busca" placeholder="Buscar por título…" aria-label="Buscar curso por título" />
            </div>
          </div>
        </div>
        <div class="grade-cursos" id="grade-cursos">
          <p class="carregando">Carregando cursos</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="rodape__envolucro envolucro">
      <span>© 2026 LeKa Dance Studio — atividade acadêmica.</span>
      <span class="rodape__nota">Projeto acadêmico de demonstração — dados fictícios, sem informações reais de alunos ou pagamentos.</span>
    </div>
  </footer>

  <script src="js/dados/api.js"></script>
  <script src="js/dados/modalidades.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/componentes/ui.js"></script>
  <script src="js/componentes/navegacao.js"></script>
  <script src="js/paginas/catalogo.js"></script>
</body>
</html>
